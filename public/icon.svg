<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <rect width="64" height="64" rx="18" fill="#F2E5BF"/>
  <!-- Card 1: Left Deep Teal with '?' -->
  <g transform="translate(18, 32) rotate(-14)">
    <rect x="-10" y="-14" width="20" height="28" rx="4" fill="#257180" stroke="#FAF3E0" stroke-width="1.5"/>
    <text x="-6" y="-8" fill="#FAF3E0" opacity="0.6" font-size="5" font-weight="900" font-family="sans-serif">♥</text>
    <text x="6" y="-8" text-anchor="end" fill="#FAF3E0" opacity="0.6" font-size="5" font-weight="900" font-family="sans-serif">♠</text>
    <text x="0" y="3" text-anchor="middle" dominant-baseline="middle" fill="#FAF3E0" font-size="11" font-weight="900" font-family="sans-serif">?</text>
    <text x="-6" y="10" fill="#FAF3E0" opacity="0.6" font-size="5" font-weight="900" font-family="sans-serif">♦</text>
    <text x="6" y="10" text-anchor="end" fill="#FAF3E0" opacity="0.6" font-size="5" font-weight="900" font-family="sans-serif">♣</text>
  </g>
  <!-- Card 2: Right Terracotta with '♥' -->
  <g transform="translate(46, 32) rotate(14)">
    <rect x="-10" y="-14" width="20" height="28" rx="4" fill="#CB6040" stroke="#FAF3E0" stroke-width="1.5"/>
    <text x="-6" y="-8" fill="#FAF3E0" opacity="0.6" font-size="5" font-weight="900" font-family="sans-serif">♥</text>
    <text x="6" y="-8" text-anchor="end" fill="#FAF3E0" opacity="0.6" font-size="5" font-weight="900" font-family="sans-serif">♠</text>
    <text x="0" y="3" text-anchor="middle" dominant-baseline="middle" fill="#FAF3E0" font-size="10" font-weight="900" font-family="sans-serif">♥</text>
    <text x="-6" y="10" fill="#FAF3E0" opacity="0.6" font-size="5" font-weight="900" font-family="sans-serif">♦</text>
    <text x="6" y="10" text-anchor="end" fill="#FAF3E0" opacity="0.6" font-size="5" font-weight="900" font-family="sans-serif">♣</text>
  </g>
  <!-- Card 3: Center Sunset Orange with 'OS' -->
  <g transform="translate(32, 30)">
    <rect x="-11" y="-15" width="22" height="30" rx="5" fill="#FD8B51" stroke="#FAF3E0" stroke-width="2"/>
    <text x="-7" y="-9" fill="#FFFFFF" opacity="0.6" font-size="5" font-weight="900" font-family="sans-serif">♥</text>
    <text x="7" y="-9" text-anchor="end" fill="#FFFFFF" opacity="0.6" font-size="5" font-weight="900" font-family="sans-serif">♠</text>
    <text x="0" y="3" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" font-size="10" font-weight="900" font-family="sans-serif" letter-spacing="0.5">OS</text>
    <text x="-7" y="11" fill="#FFFFFF" opacity="0.6" font-size="5" font-weight="900" font-family="sans-serif">♦</text>
    <text x="7" y="11" text-anchor="end" fill="#FFFFFF" opacity="0.6" font-size="5" font-weight="900" font-family="sans-serif">♣</text>
  </g>
</svg>
