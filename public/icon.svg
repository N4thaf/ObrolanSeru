<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <rect width="64" height="64" rx="18" fill="#F2E5BF"/>
  <!-- Card 1: Left Deep Teal -->
  <g transform="translate(18, 32) rotate(-14)">
    <rect x="-10" y="-14" width="20" height="28" rx="4" fill="#257180" stroke="#FAF3E0" stroke-width="1.5"/>
  </g>
  <!-- Card 2: Right Terracotta -->
  <g transform="translate(46, 32) rotate(14)">
    <rect x="-10" y="-14" width="20" height="28" rx="4" fill="#CB6040" stroke="#FAF3E0" stroke-width="1.5"/>
  </g>
  <!-- Card 3: Center Sunset Orange with italic serif 'os' -->
  <g transform="translate(32, 30)">
    <rect x="-11" y="-15" width="22" height="30" rx="5" fill="#FD8B51" stroke="#FAF3E0" stroke-width="2"/>
    <text x="0" y="3" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" font-size="12" font-weight="900" font-style="italic" font-family="Georgia, serif">os</text>
  </g>
</svg>
